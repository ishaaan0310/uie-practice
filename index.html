<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UIE Practice</title>
<meta name="description" content="Understanding Incubation and Entrepreneurship: weekly practice, shuffled mock tests and mistake review.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
<style>
/* Layout: one narrow study column; home = setup card, quiz = one question at a time, result = score + review list */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --fg:#17201d; --muted:#5d6b66; --line:#d9e0dd;
  --accent:#0f6b5c; --accent-soft:#e1efeb; --on-accent:#ffffff;
  --good:#1d7a3e; --good-soft:#e2f3e7; --bad:#b3261e; --bad-soft:#fbe7e5; --new:#8a5a00; --new-soft:#fbf0d9;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#19211e; --fg:#e7eeeb; --muted:#9aaaa4; --line:#2c3833;
  --accent:#4fc2a9; --accent-soft:#1d332d; --on-accent:#0b1512;
  --good:#5fd08a; --good-soft:#18301f; --bad:#ff8a80; --bad-soft:#3a1d1b; --new:#f0c060; --new-soft:#352a12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#19211e; --fg:#e7eeeb; --muted:#9aaaa4; --line:#2c3833;
  --accent:#4fc2a9; --accent-soft:#1d332d; --on-accent:#0b1512;
  --good:#5fd08a; --good-soft:#18301f; --bad:#ff8a80; --bad-soft:#3a1d1b; --new:#f0c060; --new-soft:#352a12; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-size:1.6rem;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:.85rem}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:10px;border-radius:7px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.hint{margin:0;color:var(--muted);font-size:.9rem}
.checks{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.check{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:700}
.check input{width:20px;height:20px;margin:0;accent-color:var(--accent);flex:none}
.check small{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.chip b{font-size:.95rem}.chip small{color:var(--muted);font-size:.72rem;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.chip[aria-pressed="true"] small{color:var(--accent)}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:4px 0;font-size:.9rem}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.sets .chip{flex-direction:row;gap:8px;padding:9px 12px}
.btn{border:0;border-radius:10px;padding:14px 16px;font-weight:700;font-size:1rem;width:100%}
.primary{background:var(--accent);color:var(--on-accent)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:transparent;border:1px solid var(--line)}
.last{margin:0;color:var(--muted);font-size:.85rem;text-align:center}
/* quiz */
.qtop{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.qtop .grow{flex:1}
.x{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.85rem}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent);letter-spacing:.03em}
.tag.new{background:var(--new-soft);color:var(--new)}
#qtext{font-family:var(--body);font-size:1.2rem;line-height:1.4;font-weight:700}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;width:100%}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.opt span:last-child{min-width:0}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .k{background:var(--good);color:var(--surface);border-color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .k{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin:0;font-weight:700;min-height:1.5em}
.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}
.nav{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.confirm{border:1px solid var(--bad);background:var(--bad-soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0}
.confirm .row{justify-content:flex-start}
.confirm .btn{width:auto;padding:10px 14px}
.danger{background:var(--bad);color:var(--surface)}
/* result */
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score strong{font-family:var(--display);font-size:3rem;line-height:1}
.score span{color:var(--muted)}
.review{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.review li{border:1px solid var(--line);border-left:4px solid var(--bad);background:var(--surface);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.review .q{font-weight:700}
.review .you{color:var(--bad);font-size:.92rem}
.review .ans{color:var(--good);font-size:.92rem}
.review small{color:var(--muted)}
.keys{color:var(--muted);font-size:.8rem;text-align:center;margin:0}
@media (hover:none){.keys{display:none}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

</head>
<body>
<div class="wrap">
  <div class="brand"><h1>UIE Practice</h1><span>NPTEL · Understanding Incubation &amp; Entrepreneurship</span></div>

  <!-- HOME -->
  <section id="home" class="wrap" style="gap:16px">
    <div class="panel">
      <div class="seg" role="group" aria-label="Mode">
        <button type="button" id="mPractice" aria-pressed="true">Practice</button>
        <button type="button" id="mTest" aria-pressed="false">Test</button>
      </div>
      <p class="hint" id="modeHint"></p>
      <div class="checks" id="testOpts" hidden>
        <label class="check" for="shufQ"><input type="checkbox" id="shufQ"><span>Shuffle questions<small>Ask questions in a random order</small></span></label>
        <label class="check" for="shufO"><input type="checkbox" id="shufO"><span>Shuffle answer options<small>Mix up the order of A–D (“All of the above” stays last)</small></span></label>
      </div>
      <div class="checks" id="practiceOpts" hidden>
        <label class="check" for="reveal"><input type="checkbox" id="reveal"><span>Show answers<small>Correct answers are highlighted from the start, for quick revision</small></span></label>
      </div>
    </div>

    <div class="panel">
      <div class="row"><p class="label">Weeks</p><button type="button" class="link" id="allWeeks">Select all</button></div>
      <div class="weeks" id="weeks"></div>
      <p class="label" style="margin-top:4px">Questions</p>
      <div class="sets">
        <button type="button" class="chip" id="setO" aria-pressed="true"><b>Original</b><small>130</small></button>
        <button type="button" class="chip" id="setX" aria-pressed="true"><b>New likely</b><small>50</small></button>
      </div>
    </div>

    <button type="button" class="btn primary" id="start">Start</button>
    <button type="button" class="btn ghost" id="mock">Mock test · 65 random questions</button>
    <p class="last" id="last"></p>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="wrap" style="gap:16px" hidden>
    <div class="qtop">
      <button type="button" class="x" id="quit">✕ Quit</button>
      <span class="grow" id="counter"></span>
      <span id="clock"></span>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <div class="panel">
      <div class="row" style="justify-content:flex-start"><span class="tag" id="wtag"></span><span class="tag new" id="ntag" hidden>New</span></div>
      <h2 id="qtext"></h2>
      <p class="hint" id="qnote"></p>
      <div class="opts" id="opts"></div>
      <p class="fb" id="fb"></p>
    </div>
    <div class="confirm" id="confirm" hidden>
      <p id="confirmMsg"></p>
      <div class="row"><button type="button" class="btn danger" id="confirmYes">Finish</button><button type="button" class="btn ghost" id="confirmNo">Keep going</button></div>
    </div>
    <div class="nav">
      <button type="button" class="btn ghost" id="prev">Previous</button>
      <button type="button" class="btn primary" id="next">Next</button>
    </div>
    <p class="keys">Keys: 1–4 choose · Enter next · ← → move</p>
  </section>

  <!-- RESULT -->
  <section id="result" class="wrap" style="gap:16px" hidden>
    <div class="panel">
      <p class="label" id="rMode"></p>
      <div class="score"><strong id="rPct"></strong><span id="rDetail"></span></div>
      <div class="row" style="flex-wrap:nowrap">
        <button type="button" class="btn primary" id="retry">Retry mistakes</button>
        <button type="button" class="btn ghost" id="home2">Home</button>
      </div>
    </div>
    <p class="label" id="rListLabel"></p>
    <ul class="review" id="review"></ul>
  </section>
</div>

const QS=[...ORIGINAL.map((a,i)=>({id:"o"+i,w:a[0],t:a[1],o:a[2],a:a[3],x:false})),
          ...EXTRA.map((a,i)=>({id:"x"+i,w:a[0],t:a[1],o:a[2],a:a[3],x:true}))];
const WEEKS=[...new Set(QS.map(q=>q.w))].sort((a,b)=>a-b);
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem("uie."+k);return v?JSON.parse(v):d}catch(e){return d}},
             set(k,v){try{localStorage.setItem("uie."+k,JSON.stringify(v))}catch(e){}}};

let cfg=Object.assign({mode:"practice",weeks:[...WEEKS],orig:true,extra:true,shufQ:true,shufO:true,reveal:false},store.get("cfg",{}));
cfg.weeks=cfg.weeks.filter(w=>WEEKS.includes(w));
let S=null, tick=null, quitArmed=false;
const BYID=Object.fromEntries(QS.map(q=>[q.id,q]));
function packSession(){return S?{mode:S.mode,name:S.name,i:S.i,t0:S.t0,items:S.items.map(it=>({id:it.q.id,order:it.order,pick:it.pick,done:it.done}))}:null}
function saveSession(){store.set("session",packSession())}
function unpackSession(p){
  if(!p||!Array.isArray(p.items)||!p.items.length) return null;
  const items=p.items.filter(x=>BYID[x.id]).map(x=>({q:BYID[x.id],order:x.order,pick:x.pick||[],done:!!x.done}));
  if(!items.length) return null;
  return {mode:p.mode,name:p.name,i:Math.min(p.i||0,items.length-1),t0:p.t0||Date.now(),items};
}
function startClock(){
  clearInterval(tick);
  const upd=()=>{$("clock").textContent=S?fmt(Math.round((Date.now()-S.t0)/1000)):""};
  upd(); tick=setInterval(upd,1000);
}

function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const PIN=/^(all|none|both) of the above$/i;
function optionOrder(q,mix){
  const idx=q.o.map((_,i)=>i);
  if(!mix) return idx;
  const pinned=idx.filter(i=>PIN.test(q.o[i].trim()));
  return [...shuffle(idx.filter(i=>!pinned.includes(i))),...pinned];
}
function pool(){return QS.filter(q=>cfg.weeks.includes(q.w)&&((q.x&&cfg.extra)||(!q.x&&cfg.orig)))}
const wLabel=w=>"Week "+w;
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");

/* ---------- HOME ---------- */
function renderHome(){
  $("mPractice").setAttribute("aria-pressed",cfg.mode==="practice");
  $("mTest").setAttribute("aria-pressed",cfg.mode==="test");
  $("modeHint").textContent=cfg.mode==="practice"
    ?(cfg.reveal?"Every question opens with the correct answer in green. Use Next to read through.":"Answers are checked right away. Questions stay in order.")
    :"No answers shown until the end. You see your score and mistakes after finishing.";
  $("testOpts").hidden=cfg.mode!=="test";
  $("practiceOpts").hidden=cfg.mode!=="practice";
  $("reveal").checked=!!cfg.reveal;
  $("shufQ").checked=!!cfg.shufQ;
  $("shufO").checked=!!cfg.shufO;
  const w=$("weeks"); w.innerHTML="";
  for(const wk of WEEKS){
    const n=QS.filter(q=>q.w===wk&&((q.x&&cfg.extra)||(!q.x&&cfg.orig))).length;
    const b=document.createElement("button"); b.type="button";
    b.className="chip"; b.setAttribute("aria-pressed",cfg.weeks.includes(wk));
    b.innerHTML="<b>W"+wk+"</b><small>"+n+" Qs</small>";
    b.onclick=()=>{cfg.weeks=cfg.weeks.includes(wk)?cfg.weeks.filter(x=>x!==wk):[...cfg.weeks,wk];save()};
    w.appendChild(b);
  }
  $("allWeeks").textContent=cfg.weeks.length===WEEKS.length?"Clear":"Select all";
  $("setO").setAttribute("aria-pressed",cfg.orig);
  $("setX").setAttribute("aria-pressed",cfg.extra);
  const n=pool().length;
  $("start").disabled=n===0;
  $("start").textContent=n?("Start "+(cfg.mode==="test"?"test":cfg.reveal?"revision":"practice")+" · "+n+" questions"):"Pick at least one week";
  const last=store.get("last",null);
  $("last").textContent=last?("Last result: "+last.c+"/"+last.n+" ("+last.mode+") · "+last.d):"";
}
function save(){store.set("cfg",cfg);renderHome()}
$("mPractice").onclick=()=>{cfg.mode="practice";save()};
$("mTest").onclick=()=>{cfg.mode="test";save()};
$("shufQ").onchange=e=>{cfg.shufQ=e.target.checked;save()};
$("shufO").onchange=e=>{cfg.shufO=e.target.checked;save()};
$("allWeeks").onclick=()=>{cfg.weeks=cfg.weeks.length===WEEKS.length?[]:[...WEEKS];save()};
$("setO").onclick=()=>{cfg.orig=!cfg.orig;if(!cfg.orig&&!cfg.extra)cfg.extra=true;save()};
$("setX").onclick=()=>{cfg.extra=!cfg.extra;if(!cfg.orig&&!cfg.extra)cfg.orig=true;save()};
$("reveal").onchange=e=>{cfg.reveal=e.target.checked;save()};
$("start").onclick=()=>{const rev=cfg.mode==="practice"&&cfg.reveal;begin(pool(),rev?"review":cfg.mode,cfg.mode==="test"?"Test":rev?"Revision":"Practice")};
$("mock").onclick=()=>{const pick=shuffle(QS.filter(q=>(q.x&&cfg.extra)||(!q.x&&cfg.orig))).slice(0,65);begin(cfg.shufQ?pick:pick.sort((a,b)=>QS.indexOf(a)-QS.indexOf(b)),"test","Mock test")};

function show(v){for(const id of ["home","quiz","result"])$(id).hidden=id!==v;window.scrollTo(0,0)}
function begin(list,mode,name){
  const test=mode==="test";
  const qs=test&&cfg.shufQ?shuffle(list):list.slice();
  S={mode,name,i:0,t0:Date.now(),
     items:qs.map(q=>({q,order:optionOrder(q,test&&cfg.shufO),pick:mode==="review"?q.a.slice():[],done:mode==="review"}))};
  quitArmed=false;
  startClock(); saveSession();
  show("quiz");renderQ();
}
const isRight=it=>it.pick.length===it.q.a.length&&it.pick.every(p=>it.q.a.includes(p));
function renderQ(){
  const it=S.items[S.i], q=it.q, test=S.mode==="test", n=S.items.length;
  const answered=S.items.filter(x=>x.pick.length>=x.q.a.length).length;
  $("counter").textContent=(S.i+1)+" / "+n+(S.mode==="review"?" · Revision":test?" · "+answered+" answered":" · "+S.items.filter(x=>x.done&&isRight(x)).length+" correct");
  $("prog").style.width=((S.i+1)/n*100)+"%";
  $("wtag").textContent=wLabel(q.w);
  $("ntag").hidden=!q.x;
  $("qtext").textContent=q.t;
  const multi=q.a.length>1;
  $("qnote").textContent=multi?("Choose "+q.a.length+" answers"):"";
  $("qnote").hidden=!multi;
  const box=$("opts"); box.innerHTML="";
  it.order.forEach((oi,pos)=>{
    const b=document.createElement("button"); b.type="button";
    b.className="opt"; b.dataset.oi=oi;
    b.innerHTML='<span class="k">'+(pos+1)+'</span><span></span>';
    b.lastChild.textContent=q.o[oi];
    if(it.done&&!test){
      b.disabled=true;
      if(q.a.includes(oi)) b.classList.add("ok");
      else if(it.pick.includes(oi)) b.classList.add("no");
    } else if(it.pick.includes(oi)) b.classList.add("sel");
    b.onclick=()=>choose(oi);
    box.appendChild(b);
  });
  const fb=$("fb"); fb.className="fb"; fb.textContent="";
  if(it.done&&!test){
    const ok=isRight(it); if(S.mode!=="review") fb.classList.add(ok?"ok":"no");
    fb.textContent=S.mode==="review"?"":ok?"Correct":"Not quite. Correct answer"+(q.a.length>1?"s are":" is")+" highlighted in green.";
  }
  $("prev").disabled=S.i===0;
  $("next").textContent=S.i===n-1?(test?"Finish test":S.mode==="review"?"Done":"See results"):"Next";
  $("confirm").hidden=true;
}
function choose(oi){
  const it=S.items[S.i], q=it.q, test=S.mode==="test";
  if(it.done&&!test) return;
  const need=q.a.length;
  if(need===1) it.pick=[oi];
  else if(it.pick.includes(oi)) it.pick=it.pick.filter(x=>x!==oi);
  else if(it.pick.length<need) it.pick=[...it.pick,oi];
  else it.pick=[...it.pick.slice(1),oi];
  if(!test&&it.pick.length===need){
    it.done=true; saveSession(); renderQ();
    if(isRight(it)){const at=S.i;setTimeout(()=>{if(S&&S.i===at&&!$("quiz").hidden)go(1)},700)}
    return;
  }
  saveSession(); renderQ();
}
function go(d){
  if(!S) return;
  const n=S.items.length;
  if(d>0&&S.i===n-1){if(S.mode==="review"){clearInterval(tick);S=null;saveSession();show("home");renderHome();return}askFinish();return}
  S.i=Math.max(0,Math.min(n-1,S.i+d)); saveSession(); renderQ(); window.scrollTo(0,0);
}
function askFinish(){
  const test=S.mode==="test";
  const left=S.items.filter(x=>test?x.pick.length<x.q.a.length:!x.done).length;
  if(left===0){finish();return}
  $("confirmMsg").textContent=left+" question"+(left>1?"s are":" is")+" unanswered and will count as wrong.";
  $("confirm").hidden=false; $("confirmYes").focus();
}
$("confirmYes").onclick=finish;
$("confirmNo").onclick=()=>{$("confirm").hidden=true};
$("prev").onclick=()=>go(-1);
$("next").onclick=()=>go(1);
$("quit").onclick=()=>{
  if(!quitArmed){quitArmed=true;$("quit").textContent="Tap again to quit";setTimeout(()=>{quitArmed=false;$("quit").textContent="✕ Quit"},2500);return}
  clearInterval(tick);S=null;saveSession();$("quit").textContent="✕ Quit";show("home");renderHome();
};

/* ---------- RESULT ---------- */
function finish(){
  clearInterval(tick);
  const secs=Math.round((Date.now()-S.t0)/1000);
  const wrong=S.items.filter(it=>!isRight(it));
  const c=S.items.length-wrong.length, n=S.items.length;
  $("rMode").textContent=S.name+" · "+fmt(secs);
  $("rPct").textContent=Math.round(c/n*100)+"%";
  $("rDetail").textContent=c+" of "+n+" correct";
  store.set("last",{c,n,mode:S.name.toLowerCase(),d:new Date().toLocaleDateString(undefined,{day:"numeric",month:"short"})});
  $("retry").hidden=wrong.length===0;
  $("rListLabel").textContent=wrong.length?("Review · "+wrong.length+" to fix"):"Every answer correct";
  const ul=$("review"); ul.innerHTML="";
  for(const it of wrong){
    const li=document.createElement("li");
    const q=document.createElement("span"); q.className="q"; q.textContent=it.q.t;
    const you=document.createElement("span"); you.className="you";
    you.textContent="Your answer: "+(it.pick.length?it.pick.map(i=>it.q.o[i]).join("; "):"not answered");
    const ans=document.createElement("span"); ans.className="ans";
    ans.textContent="Correct: "+it.q.a.map(i=>it.q.o[i]).join("; ");
    const meta=document.createElement("small"); meta.textContent=wLabel(it.q.w)+(it.q.x?" · New":"");
    li.append(q,you,ans,meta); ul.appendChild(li);
  }
  S.wrong=wrong.map(it=>it.q);
  store.set("session",null);
  show("result");
}
$("retry").onclick=()=>{const w=S.wrong;begin(w,"practice","Mistakes")};
$("home2").onclick=()=>{S=null;show("home");renderHome()};

/* ---------- KEYS ---------- */
document.addEventListener("keydown",e=>{
  if($("quiz").hidden||!S||e.metaKey||e.ctrlKey||e.altKey) return;
  const it=S.items[S.i];
  if(/^[1-9]$/.test(e.key)){const p=+e.key-1;if(p<it.order.length){choose(it.order[p]);e.preventDefault()}}
  else if(e.key==="Enter"&&document.activeElement.tagName!=="BUTTON"){go(1);e.preventDefault()}
  else if(e.key==="ArrowRight"){go(1)}
  else if(e.key==="ArrowLeft"){go(-1)}
});

function boot(data){
  const saved=unpackSession((data&&data.session)||store.get("session",null));
  renderHome();
  if(saved){S=saved;quitArmed=false;startClock();show("quiz");renderQ();}
}
boot({});
</script>
</body>
